[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-alpha"
version = "0.0.1"
description = "A 股事件驱动 + 因子研究框架：PIT 数据、可成交性回测、事件研究"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2", "duckdb>=1.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["pyarrow>=15", "akshare"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
